<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Le CV Honnête</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      padding: 40px;
    }
    h2 {
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 18px;
      margin-bottom: 20px;
    }
    ul {
      margin-bottom: 30px;
    }
    li {
      margin: 8px 0;
    }
    .generator {
      margin-top: 20px;
      padding: 20px;
      background: #1e1e1e;
      border-radius: 8px;
    }
    input {
      padding: 8px;
      width: 250px;
      margin-right: 10px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
    }
    .result {
      margin-top: 15px;
      font-style: italic;
      color: #ccc;
    }
  </style>
</head>
<body>

  <h2>😺😩 3. Le CV Honnête</h2>
  <div class="subtitle">Un générateur de CV ultra-sincère :</div>

  <ul>
    <li>“Maîtrise d’Excel” → “Je sais faire SOMME et je cherche le reste sur Google.”</li>
    <li>“Anglais courant” → “Je comprends quand on parle lentement.”</li>
  </ul>

  <div class="generator">
    <h3>Testez votre compétence :</h3>
    <input type="text" id="skillInput" placeholder="Ex: PowerPoint">
    <button onclick="generateHonestCV()">Générer version honnête</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    function generateHonestCV() {
      const skill = document.getElementById("skillInput").value.trim();
      const resultDiv = document.getElementById("result");

      if (!skill) {
        resultDiv.textContent = "Veuillez entrer une compétence.";
        return;
      }

      const honestVersions = [
        `“${skill}” → “Je me débrouille tant que ça ne devient pas compliqué.”`,
        `“${skill}” → “Je connais les bases et je regarde des tutoriels si besoin.”`,
        `“${skill}” → “Je fais semblant d’être à l’aise mais j’apprends vite.”`,
        `“${skill}” → “Je maîtrise… quand tout fonctionne correctement.”`
      ];

      const randomIndex = Math.floor(Math.random() * honestVersions.length);
      resultDiv.textContent = honestVersions[randomIndex];
    }
  </script>

</body>
</html>
